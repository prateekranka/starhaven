name: Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: github.repository == 'prateekranka/starhaven' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage static pixel pack
        run: |
          set -euo pipefail
          mkdir -p _pack
          cp index.html sw.js _headers build-info.json dist-hashes.json cache-manifest.json _pack/
          if [ -f .nojekyll ]; then cp .nojekyll _pack/; fi
          cp -R js css media vendor _pack/
          test -f _pack/index.html
          test -f _pack/js/ui/app.js
          grep -q "CONTINUE CAMPAIGN" _pack/index.html
          grep -q "SKIRMISH VS AI" _pack/index.html
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 920d78e6c05a8e15380d6205aa3f38b4
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Add a Cloudflare Pages Edit API token as a GitHub Actions secret named CLOUDFLARE_API_TOKEN so iPad playtest packs deploy on every push."
            exit 1
          fi
          echo "Deploying static pixel pack ${GITHUB_SHA} to starhaven-dev (dev)"
          npx --yes wrangler@4 pages deploy _pack --project-name starhaven-dev --branch dev --commit-hash "${GITHUB_SHA}"

  deploy-main:
    if: github.repository == 'prateekranka/starhaven' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAGES_PROJECT: starhaven
      PAGES_BRANCH: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:offline
      - run: npm run verify:no-openai
      - name: Verify release identity
        run: node scripts/release/verify-release.mjs --dist dist --source-sha "${GITHUB_SHA}" --require-clean --origin starhaven
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 920d78e6c05a8e15380d6205aa3f38b4
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Add a Cloudflare Pages Edit API token as a GitHub Actions secret named CLOUDFLARE_API_TOKEN so iPad playtest packs deploy on every push."
            exit 1
          fi
          echo "Deploying Vite greybox ${GITHUB_SHA} to ${PAGES_PROJECT} (${PAGES_BRANCH})"
          npx --yes wrangler@4 pages deploy dist --project-name "${PAGES_PROJECT}" --branch "${PAGES_BRANCH}" --commit-hash "${GITHUB_SHA}"
