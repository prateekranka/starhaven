name: Cloudflare Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'prateekranka/starhaven'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PAGES_PROJECT: ${{ github.ref_name == 'main' && 'starhaven' || 'starhaven-dev' }}
      PAGES_BRANCH: ${{ github.ref_name == 'main' && 'main' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:offline
      - run: npm run verify:no-openai
      - name: Verify release identity
        run: node scripts/release/verify-release.mjs --dist dist --source-sha "${GITHUB_SHA}" --require-clean --origin starhaven
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 920d78e6c05a8e15380d6205aa3f38b4
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Add a Cloudflare Pages Edit API token as a GitHub Actions secret named CLOUDFLARE_API_TOKEN so iPad playtest packs deploy on every push."
            exit 1
          fi
          echo "Deploying ${GITHUB_SHA} to ${PAGES_PROJECT} (${PAGES_BRANCH})"
          npx --yes wrangler@4 pages deploy dist --project-name "${PAGES_PROJECT}" --branch "${PAGES_BRANCH}" --commit-hash "${GITHUB_SHA}"
